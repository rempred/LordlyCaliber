name: Windows release ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this Main build as a GitHub prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      package-name: ${{ steps.names.outputs.package-name }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the exact Main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Name the release package
        id: names
        run: |
          $name = "LordlyCaliber-main-$($env:GITHUB_SHA.Substring(0, 12))-windows-x64"
          if ([int]$env:GITHUB_RUN_ATTEMPT -gt 1) { $name += "-attempt$env:GITHUB_RUN_ATTEMPT" }
          "package-name=$name" >> $env:GITHUB_OUTPUT
          "PACKAGE_NAME=$name" >> $env:GITHUB_ENV
          "PACKAGE_PATH=$env:GITHUB_WORKSPACE/native/dist/$name" >> $env:GITHUB_ENV
          "TOOLS_ROOT=$env:RUNNER_TEMP/lordly-tools" >> $env:GITHUB_ENV

      - name: Install authenticated build dependencies
        run: |
          ./native/tools/bootstrap.ps1 -ToolsRoot $env:TOOLS_ROOT
          ./native/tools/bootstrap-n64.ps1

      - name: Compile the editor and run public tests
        run: ./native/tools/build.ps1 -ToolsRoot $env:TOOLS_ROOT -Test

      - name: Package the complete portable application
        run: ./native/tools/package.ps1 -ToolsRoot $env:TOOLS_ROOT -Destination $env:PACKAGE_PATH

      - name: Verify ZIP contents and isolated startup
        run: ./native/tools/check-release.ps1 -Zip "$env:PACKAGE_PATH.zip" -ExpectedCommit $env:GITHUB_SHA -RequireClean

      - name: Check rejection of damaged dependencies and incomplete packages
        run: ./native/tests/release-packaging.ps1 -Zip "$env:PACKAGE_PATH.zip"

      - name: Attest the file manifest and both executables
        id: attest-files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            native/dist/${{ env.PACKAGE_NAME }}/FILES.sha256
            native/dist/${{ env.PACKAGE_NAME }}/LordlyCaliber.exe
            native/dist/${{ env.PACKAGE_NAME }}/LordlyCaliber-cli.exe

      - name: Prepare a download that extracts directly to the application
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-files.outputs.bundle-path }}
        run: |
          $out = New-Item -ItemType Directory -Path native/dist/application-files
          Copy-Item -LiteralPath $env:PACKAGE_PATH -Destination $out -Recurse
          Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE -Destination "$out/attestations.jsonl"

      - name: Upload the portable application files
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: native/dist/application-files/*
          if-no-files-found: error
          compression-level: 1
          retention-days: 30

      - name: Attest the actual GitHub download ZIP
        id: attest-zip
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.PACKAGE_NAME }}.zip
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}

      - name: Collect download checksums and verification files
        env:
          FILE_ATTESTATIONS: native/dist/application-files/attestations.jsonl
          ZIP_ATTESTATION: ${{ steps.attest-zip.outputs.bundle-path }}
          ZIP_SHA256: ${{ steps.upload.outputs.artifact-digest }}
          DOWNLOAD_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          $out = New-Item -ItemType Directory -Path native/dist/verification-files
          [IO.File]::WriteAllText("$out/$env:PACKAGE_NAME.zip.sha256", "$env:ZIP_SHA256  $env:PACKAGE_NAME.zip`n", [Text.UTF8Encoding]::new($false))
          $bundles = @($env:FILE_ATTESTATIONS, $env:ZIP_ATTESTATION) | ForEach-Object { (Get-Content -LiteralPath $_ -Raw).Trim() }
          [IO.File]::WriteAllText("$out/attestations.jsonl", ($bundles -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          Copy-Item -LiteralPath "$env:PACKAGE_PATH/build-info.json" -Destination $out
          Copy-Item -LiteralPath native/VERIFY-BUILD.md -Destination "$out/VERIFY-BUILD.md"
          @"
          ## Windows build from Main
          Source: [$env:GITHUB_SHA]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/commit/$env:GITHUB_SHA)

          [Download $env:PACKAGE_NAME.zip]($env:DOWNLOAD_URL), extract it once, and open the LordlyCaliber folder.
          It contains the editor, Qt/runtime DLLs, N64 export tools, dependency sources and notices.
          SHA-256: $env:ZIP_SHA256
          The download ZIP, file manifest and both editor executables have signed build attestations.
          The verification-files artifact provides checksum and attestation sidecars; it is optional for running the editor.
          Public tests exclude private-ROM cases; this run is not a game-playthrough check.
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Verify the exact application download
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          $out = New-Item -ItemType Directory -Path native/dist/download-check
          $zip = "$out/$env:PACKAGE_NAME.zip"
          Invoke-WebRequest -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } -OutFile $zip
          Copy-Item -LiteralPath "native/dist/verification-files/$env:PACKAGE_NAME.zip.sha256" -Destination "$zip.sha256"
          ./native/tools/check-release.ps1 -Zip $zip -ExpectedCommit $env:GITHUB_SHA -RequireClean

      - name: Upload download verification files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-files-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/dist/verification-files/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native/build/Release/*report.txt
            native/build/Release/*tests.txt
            native/build/Release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the checksum and attestation sidecars
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verification-files-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-files

      - name: Download the exact attested application ZIP without repacking
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          PACKAGE_NAME: ${{ needs.build.outputs.package-name }}
        run: |
          gh api "repos/${GH_REPO}/actions/artifacts/${ARTIFACT_ID}/zip" > "release-files/${PACKAGE_NAME}.zip"
          cd release-files
          sha256sum --check "${PACKAGE_NAME}.zip.sha256"

      - name: Publish a uniquely named Main prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_TAG: native-main-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_TITLE: ${{ needs.build.outputs.package-name }}
        run: |
          cat > release-notes.md <<EOF
          Native Windows development build from Main commit ${SOURCE_SHA}.

          Download and extract the portable ZIP, then run LordlyCaliber.exe.
          Build logs and tests: ${RUN_URL}

          Checksums, signed attestations and verification instructions accompany the ZIP.
          Qt and N64 export tools are authenticated binary dependencies; their corresponding sources and notices are included.
          Private-ROM tests and emulator playthroughs are not part of this public build.
          EOF
          gh release create "$RELEASE_TAG" release-files/* --target "$SOURCE_SHA" \
            --title "$RELEASE_TITLE" --notes-file release-notes.md --prerelease
